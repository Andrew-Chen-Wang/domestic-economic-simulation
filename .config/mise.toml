[env]
NEXT_TELEMETRY_DISABLED = "1"
NPM_CONFIG_FUND = "false"

[tools]
node = "26.13.0"
pnpm = "10.33.0"

[settings.npm]
package_manager = "pnpm"

[tasks.install]
description = "Install JS dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the website on :3000 (the simulation engine runs in-process; SQLite at data/econsim.db)"
run = "pnpm --filter website dev"

[tasks.web]
description = "Alias for dev"
depends = ["dev"]

[tasks.test]
description = "Engine and API tests (vitest)"
run = "pnpm test"
